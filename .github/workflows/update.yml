name: Pickem Tracker

on:
  workflow_dispatch:

  # GitHub cron is UTC. Each target Pacific hour is represented by both
  # possible UTC offsets (PDT/PST). The Pacific schedule gate below chooses
  # the correct local-time run and prevents duplicate DST runs.
  schedule:
    - cron: "0 13,14 * * 1"
    - cron: "0 5,6 * * 2"
    - cron: "0 17,18,19,20,22,23 * * 2"
    - cron: "0 3,4 * * 3"
    - cron: "0 5,6 * * 4"
    - cron: "0 23 * * 4"
    - cron: "0 0,2,3,6,7 * * 5"
    - cron: "0 23 * * 5"
    - cron: "0 0,1,2,3,4,6,7 * * 6"
    - cron: "0 * * * 6"
    - cron: "0 0,1,2,3,4,5,6,7 * * 0"
    - cron: "0 9,10,17,18,21,22 * * 0"
    - cron: "0 0,1 * * 1"

permissions:
  contents: write
  pages: write
  id-token: write

# Do not allow two tracker runs to write data/ at the same time.
concurrency:
  group: pickem-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Manual workflow_dispatch runs always proceed immediately.
      # Scheduled invocations are filtered using America/Los_Angeles so the
      # intended schedule stays stable across PDT/PST transitions.
      - name: Pacific schedule gate
        id: schedule_check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run requested — bypassing Pacific schedule gate."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DAY=$(TZ=America/Los_Angeles date +%u)
          HOUR=$(TZ=America/Los_Angeles date +%-H)
          RUN=false

          echo "Pacific day: $DAY"
          echo "Pacific hour: $HOUR"

          case "$DAY" in
            1)
              case "$HOUR" in
                6|22) RUN=true ;;
              esac
              ;;
            2)
              case "$HOUR" in
                10|12|15|20) RUN=true ;;
              esac
              ;;
            3)
              case "$HOUR" in
                22) RUN=true ;;
              esac
              ;;
            4)
              case "$HOUR" in
                16|19|23) RUN=true ;;
              esac
              ;;
            5)
              case "$HOUR" in
                16|18|20|23) RUN=true ;;
              esac
              ;;
            6)
              # Saturday: run every Pacific hour.
              RUN=true
              ;;
            7)
              case "$HOUR" in
                2|10|14|17) RUN=true ;;
              esac
              ;;
          esac

          echo "run=$RUN" >> "$GITHUB_OUTPUT"

          if [ "$RUN" = "true" ]; then
            echo "Scheduled Pacific run approved."
          else
            echo "UTC cron fired only as a PDT/PST candidate; skipping this duplicate slot."
          fi

      # IMPORTANT: continue-on-error is intentional. If the final integrity
      # audit fails, the workflow must still checkpoint successful ingestion /
      # enrichment changes to data/ before reporting the workflow failure.
      - name: Run full Pick Em tracker
        id: tracker
        if: steps.schedule_check.outputs.run == 'true'
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_USERNAME: barstoolpickem
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          echo "=========================================="
          echo "RUNNING FULL PICK EM TRACKER"
          echo "=========================================="
          echo "UTC time:"
          date
          echo "Pacific time:"
          TZ=America/Los_Angeles date
          echo "=========================================="
          python python_scripts/run_all.py

      # This is the key durability boundary. Even if run_all.py finishes with
      # a failed integrity audit, valid data/state changes are persisted so the
      # next run does not restart from stale repository state and re-ingest the
      # same immutable X posts.
      - name: Checkpoint updated tracker data
        if: always() && steps.schedule_check.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No tracker data changes to checkpoint."
          else
            git commit -m "Update Pick Em tracker data"
            git push
          fi

      # Never publish a site generated from a tracker run whose integrity audit
      # failed. The checkpoint above is allowed; publication is not.
      - name: Configure GitHub Pages
        if: steps.schedule_check.outputs.run == 'true' && steps.tracker.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.schedule_check.outputs.run == 'true' && steps.tracker.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.schedule_check.outputs.run == 'true' && steps.tracker.outcome == 'success'
        uses: actions/deploy-pages@v4

      # continue-on-error on the tracker step exists only to allow the checkpoint
      # to run. Restore a red workflow result after checkpointing when the
      # tracker/audit itself failed.
      - name: Preserve tracker failure after checkpoint
        if: always() && steps.schedule_check.outputs.run == 'true' && steps.tracker.outcome != 'success'
        shell: bash
        run: |
          echo "Tracker audit failed, but data/ was checkpointed for deterministic repair on the next run."
          exit 1
