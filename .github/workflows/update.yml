name: Pickem Tracker

on:
  workflow_dispatch:

  # ==========================================================
  # PACIFIC-TIME SCHEDULE
  #
  # GitHub Actions now supports timezone-aware schedules.
  # No UTC conversion or PDT/PST safety gate is required.
  #
  # We run at :07 instead of :00 because GitHub documents
  # higher scheduled-workflow load at the start of the hour.
  #
  # Monday:
  #   6:07 AM, 10:07 PM
  #
  # Tuesday:
  #   10:07 AM, 12:07 PM, 3:07 PM, 8:07 PM
  #
  # Wednesday:
  #   10:07 PM
  #
  # Thursday:
  #   4:07 PM, 7:07 PM, 11:07 PM
  #
  # Friday:
  #   4:07 PM, 6:07 PM, 8:07 PM, 11:07 PM
  #
  # Saturday:
  #   Every hour at :07
  #
  # Sunday:
  #   2:07 AM, 10:07 AM, 2:07 PM, 5:07 PM
  #
  # America/Los_Angeles automatically handles PDT/PST.
  # ==========================================================

  schedule:

    # Monday — 6 AM, 10 PM PT
    - cron: "7 6,22 * * 1"
      timezone: "America/Los_Angeles"

    # Tuesday — 10 AM, 12 PM, 3 PM, 8 PM PT
    - cron: "7 10,12,15,20 * * 2"
      timezone: "America/Los_Angeles"

    # Wednesday — 10 PM PT
    - cron: "7 22 * * 3"
      timezone: "America/Los_Angeles"

    # Thursday — 4 PM, 7 PM, 11 PM PT
    - cron: "7 16,19,23 * * 4"
      timezone: "America/Los_Angeles"

    # Friday — 4 PM, 6 PM, 8 PM, 11 PM PT
    - cron: "7 16,18,20,23 * * 5"
      timezone: "America/Los_Angeles"

    # Saturday — EVERY HOUR PT
    - cron: "37 * * * 6"
      timezone: "America/Los_Angeles"

    # Sunday — 2 AM, 10 AM, 2 PM, 5 PM PT
    - cron: "7 2,10,14,17 * * 0"
      timezone: "America/Los_Angeles"


permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # RUN FULL TRACKER
      # ======================================================

      - name: Run tracker
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_USERNAME: barstoolpickem
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          echo "=========================================="
          echo "RUNNING FULL PICK EM TRACKER"
          echo "=========================================="
          echo "UTC time:"
          date
          echo "Pacific time:"
          TZ=America/Los_Angeles date
          echo "=========================================="

          python python_scripts/run_all.py


      # ======================================================
      # COMMIT UPDATED DATA
      # ======================================================

      - name: Commit updated tracker data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No tracker data changes to commit."
          else
            git commit -m "Update Pick Em tracker data"
            git push
          fi


      # ======================================================
      # DEPLOY WEBSITE
      # ======================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .


      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
