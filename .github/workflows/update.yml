name: Pickem Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check Pacific schedule
        id: schedule_check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested — running tracker."
            exit 0
          fi

          DAY=$(TZ=America/Los_Angeles date +%u)
          HOUR=$(TZ=America/Los_Angeles date +%-H)

          echo "Pacific day=$DAY hour=$HOUR"

          RUN=false

          case "$DAY" in

            1) # Monday
              case "$HOUR" in
                6|22) RUN=true ;;
              esac
              ;;

            2) # Tuesday
              case "$HOUR" in
                10|12|15|20) RUN=true ;;
              esac
              ;;

            3) # Wednesday
              case "$HOUR" in
                22) RUN=true ;;
              esac
              ;;

            4) # Thursday
              case "$HOUR" in
                16|19|23) RUN=true ;;
              esac
              ;;

            5) # Friday
              case "$HOUR" in
                16|18|20|23) RUN=true ;;
              esac
              ;;

            6) # Saturday — every hour
              RUN=true
              ;;

            7) # Sunday
              case "$HOUR" in
                2|10|14|17) RUN=true ;;
              esac
              ;;

          esac

          echo "run=$RUN" >> "$GITHUB_OUTPUT"

          if [ "$RUN" = "true" ]; then
            echo "Scheduled Pacific run — proceeding."
          else
            echo "Not a scheduled Pacific run — stopping before API usage."
          fi

      - name: Checkout repository
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.schedule_check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tracker
        if: steps.schedule_check.outputs.run == 'true'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_USERNAME: barstoolpickem
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          python python_scripts/run_all.py

      - name: Commit updated tracker data
        if: steps.schedule_check.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No tracker data changes to commit."
          else
            git commit -m "Update Pick Em tracker data"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.schedule_check.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.schedule_check.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
