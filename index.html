<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Barstool Pick Em Tracker</title>
<style>
:root{--bg:#090b10;--panel:#11151d;--panel2:#171c25;--text:#f6f7fb;--muted:#8c96a8;--green:#32d583;--red:#f97066;--gold:#fdb022;--line:#252b36;--blue:#53b1fd}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b25 0,#090b10 34%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:34px 18px 70px}.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--gold);font-weight:800}.title{font-size:clamp(30px,5vw,58px);margin:4px 0 0;letter-spacing:-.04em}.sub{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 35px #0004}.name{font-size:20px;font-weight:850}.record{font-size:38px;font-weight:900;letter-spacing:-.05em;margin-top:14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.metric{background:#0b0e14;border:1px solid var(--line);border-radius:12px;padding:10px}.metric b{display:block;font-size:17px}.metric span{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.positive{color:var(--green)}.negative{color:var(--red)}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin:28px 0 14px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:999px;cursor:pointer;font-weight:750}.btn.active{background:#fff;color:#111;border-color:#fff}.tableWrap{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:#0d1016}th,td{padding:13px 14px;border-bottom:1px solid var(--line)}td{font-size:14px}.pick{font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:850}.WIN{background:#123728;color:#6ce9a6}.LOSS{background:#401c1c;color:#fda29b}.PUSH{background:#353018;color:#fec84b}.OPEN{background:#17314a;color:#84caff}.REVIEW{background:#392817;color:#fdb022}.FINAL{background:#20242d;color:#d0d5dd}.lock{color:var(--gold);font-size:11px;font-weight:900;margin-left:6px}.source{color:var(--blue);text-decoration:none}.empty{text-align:center;padding:34px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.tableWrap{overflow:auto}table{min-width:820px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><div class="eyebrow">2026 VERIFIED PICK TRACKER</div><h1 class="title">Barstool Pick Em</h1></div><div class="sub" id="updated">Loading…</div></div>
<div class="grid" id="cards"></div>
<div class="controls" id="filters"></div>
<div class="tableWrap"><table><thead><tr><th>Picker</th><th>Pick</th><th>Matchup</th><th>Odds</th><th>Units</th><th>Status</th><th>P/L</th><th>Source</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>No picks found.</div></div>
</div>
<script>
let D={cappers:[],picks:[]}, filter='ALL';
const fmt=n=>`${n>0?'+':''}${Number(n||0).toFixed(2)}u`;
function cards(){document.querySelector('#cards').innerHTML=D.cappers.map(c=>`<div class="card"><div class="name">${c.picker}</div><div class="record">${c.wins}-${c.losses}-${c.pushes}</div><div class="metrics"><div class="metric"><b class="${c.units>=0?'positive':'negative'}">${fmt(c.units)}</b><span>Units</span></div><div class="metric"><b>${c.roi}%</b><span>ROI</span></div><div class="metric"><b>${c.mortal_lock}</b><span>Mortal Lock</span></div></div></div>`).join('')}
function filters(){const a=['ALL','Big Cat','Stool Presidente','Rico Bosco','OPEN','FINAL','MORTAL LOCKS'];document.querySelector('#filters').innerHTML=a.map(x=>`<button class="btn ${x===filter?'active':''}" onclick="filter='${x.replaceAll("'","\\'")}';render()">${x}</button>`).join('')}
function pickResult(p){return p.status==='FINAL'?p.result:p.status}
function rows(){let p=[...D.picks].reverse();if(filter==='OPEN'||filter==='FINAL')p=p.filter(x=>x.status===filter);else if(filter==='MORTAL LOCKS')p=p.filter(x=>x.mortal_lock);else if(filter!=='ALL')p=p.filter(x=>x.picker===filter);const body=document.querySelector('#rows');document.querySelector('#empty').hidden=!!p.length;body.innerHTML=p.map(x=>`<tr><td><b>${x.picker}</b>${x.mortal_lock?'<span class="lock">MORTAL</span>':''}</td><td class="pick">${x.selection||''}</td><td>${x.matchup||'—'}</td><td>${x.odds??'—'}</td><td>${x.units??1}</td><td><span class="pill ${pickResult(x)}">${pickResult(x)}</span>${x.final_score?`<div class="sub">${x.final_score}</div>`:''}</td><td class="${(x.profit_units||0)>=0?'positive':'negative'}">${x.status==='FINAL'?fmt(x.profit_units):'—'}</td><td>${x.source_url?`<a class="source" target="_blank" href="${x.source_url}">X post ↗</a>`:'—'}</td></tr>`).join('')}
function render(){cards();filters();rows()}
fetch('data/dashboard.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;document.querySelector('#updated').textContent='Updated '+new Date(d.updated_at).toLocaleString();render()}).catch(()=>{document.querySelector('#updated').textContent='Run scripts/build_site.py first';render()})
</script></body></html>
