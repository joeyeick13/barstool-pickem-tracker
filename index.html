<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Barstool Pick Em Tracker</title>

<style>

:root{
  --bg:#090b0f;
  --panel:#12161d;
  --panel2:#181d26;
  --panel3:#0f1319;
  --text:#f5f7fa;
  --muted:#98a2b1;
  --border:#282f3a;
  --border2:#343d49;
  --good:#56d38b;
  --bad:#ff6262;
  --blue:#67a9ff;
  --red:#ff6b6b;
  --gold:#f6c85f;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button{
  font:inherit;
}

button,
.card,
.weekRow{
  -webkit-tap-highlight-color:transparent;
}

.shell{
  max-width:1050px;
  margin:auto;
  padding:
    max(20px,env(safe-area-inset-top))
    16px
    52px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  margin-bottom:17px;
}

.headerTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}

.eyebrow{
  font-size:11px;
  letter-spacing:.17em;
  color:var(--muted);
  font-weight:900;
}

h1{
  margin:5px 0 0;
  font-size:clamp(29px,7vw,46px);
  letter-spacing:-.045em;
  line-height:1;
}

.updated{
  margin-top:3px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}


/* =========================================================
   STATUS STRIP
========================================================= */

.statusStrip{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:14px;
  overflow-x:auto;
  scrollbar-width:none;
}

.statusStrip::-webkit-scrollbar{
  display:none;
}

.statusPill{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--border);
  background:var(--panel3);
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  font-weight:800;
  color:var(--muted);
}

.statusPill strong{
  color:var(--text);
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--muted);
}

.dot.good{
  background:var(--good);
}

.dot.open{
  background:var(--gold);
}


/* =========================================================
   SECTION HEADERS
========================================================= */

.metricHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:2px 0 10px;
}

.metricHead h2{
  margin:0;
  font-size:18px;
  letter-spacing:-.02em;
}

.metricHead span{
  color:var(--muted);
  font-size:11px;
}


/* =========================================================
   SUMMARY CARDS
========================================================= */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.card{
  position:relative;
  border:1px solid var(--border);
  background:
    linear-gradient(
      180deg,
      var(--panel2),
      var(--panel)
    );
  border-radius:20px;
  padding:18px;
  min-width:0;
  cursor:pointer;
  transition:
    border-color .15s ease,
    transform .15s ease,
    background .15s ease;
}

.card:active{
  transform:scale(.99);
}

.card.leader{
  border-color:rgba(246,200,95,.55);
}

.leaderTag{
  position:absolute;
  top:13px;
  right:13px;
  display:flex;
  align-items:center;
  gap:4px;
  border:1px solid rgba(246,200,95,.35);
  background:rgba(246,200,95,.08);
  color:var(--gold);
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  letter-spacing:.08em;
  font-weight:900;
}

.rankTag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 6px;
  border-radius:999px;
  border:1px solid var(--border2);
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  margin-bottom:10px;
}

.rankTag.first{
  color:var(--gold);
  border-color:rgba(246,200,95,.4);
  background:rgba(246,200,95,.08);
}

.name{
  font-size:14px;
  font-weight:900;
  letter-spacing:.035em;
  padding-right:50px;
}

.record{
  font-size:38px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.05em;
  margin:14px 0 5px;
}

.pct{
  font-size:15px;
  font-weight:850;
}


/* =========================================================
   SECTION
========================================================= */

.section{
  margin-top:14px;
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:20px;
  overflow:hidden;
}

.sectionInner{
  padding:17px;
}

.sectionHead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:6px;
}

.sectionHead h2{
  margin:0;
  font-size:19px;
  letter-spacing:-.02em;
}

.sectionHead span{
  color:var(--muted);
  font-size:11px;
  padding-top:3px;
}


/* =========================================================
   CHART
========================================================= */

.chartWrap{
  width:100%;
  overflow:hidden;
}

#race{
  display:block;
  width:100%;
  height:auto;
}

.grid{
  stroke:#2a323d;
  stroke-width:1;
}

.axistext{
  fill:#828d9c;
  font-size:10px;
}

.line{
  fill:none;
  stroke-width:3.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.endpct{
  fill:#f5f7fa;
  font-weight:900;
  font-size:11px;
}

.avatarText{
  fill:#090b0f;
  font-size:9px;
  font-weight:950;
  text-anchor:middle;
  dominant-baseline:central;
}


/* =========================================================
   WEEKLY LEADERBOARD
========================================================= */

.weekBoard{
  display:grid;
  gap:0;
}

.weekRow{
  display:grid;
  grid-template-columns:
    34px
    minmax(0,1fr)
    auto;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

.weekRow:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.weekRow:first-child{
  padding-top:6px;
}

.weekRow:active{
  opacity:.8;
}

.rank{
  display:flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--panel2);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:11px;
  font-weight:900;
}

.rank.first{
  border-color:rgba(246,200,95,.4);
  color:var(--gold);
  background:rgba(246,200,95,.08);
}

.weekName{
  min-width:0;
}

.weekName strong{
  display:block;
  font-size:13px;
}

.weekName span{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
}

.weekRecord{
  text-align:right;
  font-size:19px;
  font-weight:950;
  letter-spacing:-.03em;
}

.weekPct{
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
}


/* =========================================================
   FULL CARD BUTTON
========================================================= */

.fullbtn{
  width:100%;
  margin-top:14px;
  border:0;
  background:#f5f7fa;
  color:#090b0f;
  border-radius:16px;
  padding:16px 18px;
  font-weight:950;
  font-size:15px;
  cursor:pointer;
}

.fullbtn:active{
  transform:scale(.995);
}


/* =========================================================
   VIEWS
========================================================= */

.view{
  display:none;
}

.view.active{
  display:block;
}

.back{
  border:0;
  background:transparent;
  color:var(--text);
  padding:5px 0 15px;
  font-weight:850;
}


/* =========================================================
   FULL CARD FILTERS
========================================================= */

.weeks,
.filters{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
}

.weeks{
  padding:3px 0 11px;
}

.filters{
  padding:0 0 16px;
}

.weeks::-webkit-scrollbar,
.filters::-webkit-scrollbar{
  display:none;
}

.weekbtn,
.filterbtn{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  border-radius:999px;
  padding:9px 13px;
  white-space:nowrap;
  font-weight:850;
  font-size:12px;
}

.weekbtn.active,
.filterbtn.active{
  background:var(--text);
  border-color:var(--text);
  color:var(--bg);
}


/* =========================================================
   FULL CARD CONTENT
========================================================= */

.pickerBlock{
  margin:0 0 14px;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  background:var(--panel);
}

.pickerTitle{
  padding:14px 15px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-weight:900;
}

.pickerTitle span:last-child{
  color:var(--muted);
}

.pick{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  padding:13px 15px;
  border-bottom:1px solid var(--border);
}

.pick:last-child{
  border-bottom:0;
}

.sel{
  font-weight:850;
  line-height:1.3;
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
  line-height:1.5;
}

.badge{
  display:inline-block;
  border:1px solid var(--border2);
  border-radius:999px;
  padding:2px 6px;
  margin-right:5px;
  font-size:9px;
  font-weight:850;
}

.result{
  font-size:19px;
  align-self:center;
}

.empty{
  padding:18px;
  color:var(--muted);
  font-size:12px;
}

.source{
  color:inherit;
  text-decoration:none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:680px){

  .shell{
    padding-left:16px;
    padding-right:16px;
  }

  .updated{
    display:none;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .card{
    display:grid;
    grid-template-columns:1fr auto;
    grid-template-areas:
      "rank rank"
      "name record"
      "pct record";
    align-items:center;
    padding:16px;
  }

  .rankTag{
    grid-area:rank;
    justify-self:start;
    margin-bottom:8px;
  }

  .name{
    grid-area:name;
  }

  .record{
    grid-area:record;
    margin:0;
    padding-left:12px;
    font-size:34px;
  }

  .pct{
    grid-area:pct;
    margin-top:3px;
  }

  .leaderTag{
    top:10px;
    right:10px;
  }

  .sectionInner{
    padding:15px;
  }

}

@media(min-width:681px){

  .card:hover{
    border-color:var(--border2);
  }

  .weekRow:hover{
    opacity:.9;
  }

  .source:hover{
    text-decoration:underline;
  }

}

</style>

</head>


<body>

<main class="shell">


<!-- =======================================================
     OVERVIEW
======================================================== -->

<section
  id="overview"
  class="view active">


  <header class="header">

    <div class="headerTop">

      <div>

        <div
          id="seasonLabel"
          class="eyebrow">
          2026 SEASON
        </div>

        <h1>
          Barstool Pick Em
        </h1>

      </div>

      <div
        id="updated"
        class="updated">
      </div>

    </div>


    <div
      id="statusStrip"
      class="statusStrip">
    </div>

  </header>


  <div class="metricHead">

    <h2>
      Overall
    </h2>

    <span>
      Season record
    </span>

  </div>


  <div
    id="cards"
    class="cards">
  </div>


  <section class="section">

    <div class="sectionInner">

      <div class="sectionHead">

        <h2>
          Season Race
        </h2>

        <span>
          Cumulative win %
        </span>

      </div>

      <div class="chartWrap">

        <svg
          id="race"
          viewBox="0 0 900 280"
          role="img"
          aria-label="Cumulative win percentage by week">
        </svg>

      </div>

    </div>

  </section>


  <section class="section">

    <div class="sectionInner">

      <div class="sectionHead">

        <h2 id="weekBoardTitle">
          This Week
        </h2>

        <span>
          Weekly leaderboard
        </span>

      </div>

      <div
        id="weekBoard"
        class="weekBoard">
      </div>

    </div>

  </section>


  <button
    id="openCards"
    class="fullbtn">
    Full Card View →
  </button>


</section>



<!-- =======================================================
     FULL CARD VIEW
======================================================== -->

<section
  id="full"
  class="view">


  <button
    id="back"
    class="back">
    ← Overview
  </button>


  <header class="header">

    <div class="eyebrow">
      2026 SEASON
    </div>

    <h1>
      Full Card View
    </h1>

  </header>


  <div
    id="weeks"
    class="weeks">
  </div>


  <div
    id="filters"
    class="filters">
  </div>


  <div
    id="cardBody">
  </div>


</section>


</main>


<script>

/* =========================================================
   CONFIG
========================================================= */

const PICKERS=[
  "Big Cat",
  "Stool Presidente",
  "Rico Bosco"
];

const COLORS={
  "Big Cat":"#67a9ff",
  "Stool Presidente":"#ff6b6b",
  "Rico Bosco":"#f6c85f"
};

const AVATARS={
  "Big Cat":"assets/bigcat.jpg",
  "Stool Presidente":"assets/pres.jpg",
  "Rico Bosco":"assets/rico.jpg"
};

const INITIALS={
  "Big Cat":"BC",
  "Stool Presidente":"DP",
  "Rico Bosco":"RB"
};

let DATA={
  cappers:[],
  win_pct_history:{},
  weeks:[],
  picks:[]
};

let selectedWeek=null;

let selectedFilter="All";

const $=
  selector=>
    document.querySelector(
      selector
    );


/* =========================================================
   HELPERS
========================================================= */

function recordFromValues(
  wins,
  losses,
  pushes
){

  return (
    `${wins||0}-${losses||0}`
    +
    (
      pushes
      ?
      `-${pushes}`
      :
      ""
    )
  );

}


function record(c){

  return recordFromValues(
    c.wins,
    c.losses,
    c.pushes
  );

}


function finalized(p){

  return (
    p.status==="FINAL"
    &&
    ["WIN","LOSS","PUSH"].includes(
      p.result
    )
  );

}


function statsForPicks(
  picks
){

  const finals=
    picks.filter(
      finalized
    );

  const wins=
    finals.filter(
      p=>p.result==="WIN"
    ).length;

  const losses=
    finals.filter(
      p=>p.result==="LOSS"
    ).length;

  const pushes=
    finals.filter(
      p=>p.result==="PUSH"
    ).length;

  const pct=
    wins+losses
    ?
    wins/(wins+losses)*100
    :
    0;

  return {
    wins,
    losses,
    pushes,
    pct,
    finals:finals.length
  };

}


function latestWeek(){

  const weeks=
    DATA.weeks
    &&
    DATA.weeks.length
    ?
    DATA.weeks
    :
    [1];

  return +weeks.at(-1);

}


function formatUpdatedTime(){

  if(
    !DATA.updated_at
  ){
    return "Update time unavailable";
  }

  const d=
    new Date(
      DATA.updated_at
    );

  return d.toLocaleTimeString(
    [],
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =========================================================
   STATUS STRIP
========================================================= */

function renderStatus(){

  const week=
    latestWeek();

  const weekPicks=
    DATA.picks.filter(
      p=>+p.week===week
    );

  const pending=
    weekPicks.filter(
      p=>!finalized(p)
    ).length;

  const updated=
    formatUpdatedTime();


  const completionPill=
    pending===0
    ?
    `
      <div class="statusPill">
        <span class="dot good"></span>
        <strong>Week Complete ✓</strong>
      </div>
    `
    :
    `
      <div class="statusPill">
        <span class="dot open"></span>
        <strong>${pending}</strong>
        pending
      </div>
    `;


  $("#statusStrip").innerHTML=
    `
      <div class="statusPill">
        <strong>Week ${week}</strong>
      </div>

      <div class="statusPill">
        Updated as of
        <strong>${updated}</strong>
      </div>

      ${completionPill}
    `;

}


/* =========================================================
   OVERALL STANDINGS
========================================================= */

function sortedCappers(){

  return PICKERS.map(
    picker=>
      DATA.cappers.find(
        c=>c.picker===picker
      )
      ||
      {
        picker,
        wins:0,
        losses:0,
        pushes:0,
        win_pct:0
      }
  )
  .sort(
    (a,b)=>{

      const pctDiff=
        (b.win_pct||0)
        -
        (a.win_pct||0);

      if(pctDiff!==0){
        return pctDiff;
      }

      const gamesA=
        (a.wins||0)
        +
        (a.losses||0);

      const gamesB=
        (b.wins||0)
        +
        (b.losses||0);

      if(gamesB!==gamesA){
        return gamesB-gamesA;
      }

      return (
        (b.wins||0)
        -
        (a.wins||0)
      );

    }
  );

}


/* =========================================================
   OVERALL CARDS
========================================================= */

function renderCards(){

  const cappers=
    sortedCappers();


  $("#cards").innerHTML=
    cappers.map(
      (capper,index)=>{

        const picker=
          capper.picker;

        const isLeader=
          index===0
          &&
          (
            (capper.wins||0)
            +
            (capper.losses||0)
            >
            0
          );


        return `
          <article
            class="card ${isLeader?"leader":""}"
            data-picker="${picker}"
            role="button"
            tabindex="0">

            ${
              isLeader
              ?
              `
                <div class="leaderTag">
                  ★ LEADER
                </div>
              `
              :
              ""
            }

            <div
              class="rankTag ${index===0?"first":""}">
              #${index+1}
            </div>

            <div class="name">
              ${picker.toUpperCase()}
            </div>

            <div class="record">
              ${record(capper)}
            </div>

            <div class="pct">
              ${(capper.win_pct||0).toFixed(1)}% overall win rate
            </div>

          </article>
        `;

      }
    ).join(
      ""
    );


  document.querySelectorAll(
    ".card[data-picker]"
  ).forEach(
    card=>{

      function openPicker(){

        selectedWeek=
          latestWeek();

        selectedFilter=
          card.dataset.picker;

        openFullView();

      }

      card.addEventListener(
        "click",
        openPicker
      );

      card.addEventListener(
        "keydown",
        event=>{

          if(
            event.key==="Enter"
            ||
            event.key===" "
          ){

            event.preventDefault();

            openPicker();

          }

        }
      );

    }
  );

}


/* =========================================================
   SVG
========================================================= */

function svgEl(
  tag,
  attrs={}
){

  const node=
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      tag
    );

  Object.entries(
    attrs
  ).forEach(
    ([key,value])=>
      node.setAttribute(
        key,
        value
      )
  );

  return node;

}


/* =========================================================
   SEASON RACE
========================================================= */

function renderChart(){

  const svg=
    $("#race");

  svg.innerHTML="";


  const all=
    PICKERS.flatMap(
      picker=>
        DATA.win_pct_history[picker]
        ||
        []
    );


  if(!all.length){

    svg.setAttribute(
      "viewBox",
      "0 0 900 220"
    );

    const text=
      svgEl(
        "text",
        {
          x:450,
          y:110,
          "text-anchor":"middle",
          class:"axistext"
        }
      );

    text.textContent=
      "Win % history will appear after picks are graded.";

    svg.appendChild(
      text
    );

    return;

  }


  const weeks=[
    ...new Set(
      all.map(
        point=>
          +point.week
      )
    )
  ].sort(
    (a,b)=>a-b
  );


  const H=
    weeks.length===1
    ?
    220
    :
    weeks.length<=3
    ?
    250
    :
    300;

  const W=900;

  const L=48;
  const R=100;
  const T=25;
  const B=40;

  svg.setAttribute(
    "viewBox",
    `0 0 ${W} ${H}`
  );


  const vals=
    all.map(
      d=>+d.win_pct
    );


  let ymin=
    Math.max(
      0,
      Math.floor(
        (
          Math.min(...vals)
          -
          8
        )
        /
        5
      )
      *
      5
    );


  let ymax=
    Math.min(
      100,
      Math.ceil(
        (
          Math.max(...vals)
          +
          8
        )
        /
        5
      )
      *
      5
    );


  if(
    ymax-ymin<20
  ){

    ymin=
      Math.max(
        0,
        ymin-10
      );

    ymax=
      Math.min(
        100,
        ymax+10
      );

  }


  const x=
    week=>
      weeks.length===1
      ?
      L+(W-L-R)/2
      :
      L+
      (
        week-weeks[0]
      )
      /
      (
        weeks.at(-1)
        -
        weeks[0]
      )
      *
      (
        W-L-R
      );


  const y=
    value=>
      T+
      (
        ymax-value
      )
      /
      (
        ymax-ymin
      )
      *
      (
        H-T-B
      );


  for(
    let i=0;
    i<=4;
    i++
  ){

    const value=
      ymin+
      (
        ymax-ymin
      )
      *
      i/4;

    const yy=
      y(
        value
      );


    svg.appendChild(
      svgEl(
        "line",
        {
          x1:L,
          y1:yy,
          x2:W-R,
          y2:yy,
          class:"grid"
        }
      )
    );


    const label=
      svgEl(
        "text",
        {
          x:L-8,
          y:yy+4,
          "text-anchor":"end",
          class:"axistext"
        }
      );


    label.textContent=
      `${value.toFixed(0)}%`;

    svg.appendChild(
      label
    );

  }


  weeks.forEach(
    week=>{

      const label=
        svgEl(
          "text",
          {
            x:x(week),
            y:H-12,
            "text-anchor":"middle",
            class:"axistext"
          }
        );

      label.textContent=
        `W${week}`;

      svg.appendChild(
        label
      );

    }
  );


  PICKERS.forEach(
    picker=>{

      const series=
        DATA.win_pct_history[picker]
        ||
        [];


      if(!series.length){
        return;
      }


      const points=
        series
        .map(
          point=>
            `${
              x(
                +point.week
              )
            },${
              y(
                +point.win_pct
              )
            }`
        )
        .join(
          " "
        );


      svg.appendChild(
        svgEl(
          "polyline",
          {
            points,
            class:"line",
            stroke:COLORS[picker]
          }
        )
      );


      const last=
        series.at(-1);

      const cx=
        x(
          +last.week
        );

      const cy=
        y(
          +last.win_pct
        );


      const group=
        svgEl(
          "g"
        );


      const clipId=
        `clip-${INITIALS[picker]}`;


      const defs=
        svgEl(
          "defs"
        );


      const clip=
        svgEl(
          "clipPath",
          {
            id:clipId
          }
        );


      clip.appendChild(
        svgEl(
          "circle",
          {
            cx:cx+21,
            cy,
            r:17
          }
        )
      );


      defs.appendChild(
        clip
      );

      group.appendChild(
        defs
      );


      group.appendChild(
        svgEl(
          "circle",
          {
            cx:cx+21,
            cy,
            r:18,
            fill:COLORS[picker],
            stroke:"#090b0f",
            "stroke-width":3
          }
        )
      );


      const initials=
        svgEl(
          "text",
          {
            x:cx+21,
            y:cy+1,
            class:"avatarText"
          }
        );

      initials.textContent=
        INITIALS[picker];

      group.appendChild(
        initials
      );


      const image=
        svgEl(
          "image",
          {
            href:AVATARS[picker],
            x:cx+4,
            y:cy-17,
            width:34,
            height:34,
            "clip-path":
              `url(#${clipId})`,
            preserveAspectRatio:
              "xMidYMid slice"
          }
        );


      image.addEventListener(
        "error",
        ()=>{

          image.style.display=
            "none";

        }
      );


      group.appendChild(
        image
      );


      const pct=
        svgEl(
          "text",
          {
            x:cx+44,
            y:cy+4,
            class:"endpct"
          }
        );


      pct.textContent=
        `${
          (+last.win_pct)
          .toFixed(1)
        }%`;


      group.appendChild(
        pct
      );


      svg.appendChild(
        group
      );

    }
  );

}


/* =========================================================
   WEEKLY LEADERBOARD
========================================================= */

function weeklyBoardData(){

  const week=
    latestWeek();


  const board=
    PICKERS.map(
      picker=>{

        const stats=
          statsForPicks(
            DATA.picks.filter(
              pick=>
                pick.picker===picker
                &&
                +pick.week===week
            )
          );

        return {
          picker,
          ...stats
        };

      }
    );


  board.sort(
    (a,b)=>{

      if(
        b.pct!==a.pct
      ){
        return b.pct-a.pct;
      }

      if(
        b.wins!==a.wins
      ){
        return b.wins-a.wins;
      }

      return a.losses-b.losses;

    }
  );


  return board;

}


function renderWeekBoard(){

  const week=
    latestWeek();

  const board=
    weeklyBoardData();


  $("#weekBoardTitle").textContent=
    `Week ${week}`;


  $("#weekBoard").innerHTML=
    board.map(
      (row,index)=>{

        return `
          <div
            class="weekRow"
            data-picker="${row.picker}"
            role="button"
            tabindex="0">

            <div
              class="rank ${index===0?"first":""}">
              ${index+1}
            </div>

            <div class="weekName">

              <strong>
                ${row.picker}
              </strong>

              <span>
                ${
                  row.finals
                  ?
                  `${row.finals} graded picks`
                  :
                  "No graded picks"
                }
              </span>

            </div>

            <div>

              <div class="weekRecord">

                ${
                  recordFromValues(
                    row.wins,
                    row.losses,
                    row.pushes
                  )
                }

              </div>

              <div class="weekPct">

                ${
                  row.wins+row.losses
                  ?
                  `${row.pct.toFixed(1)}%`
                  :
                  "—"
                }

              </div>

            </div>

          </div>
        `;

      }
    ).join(
      ""
    );


  document.querySelectorAll(
    ".weekRow[data-picker]"
  ).forEach(
    row=>{

      function openPickerWeek(){

        selectedWeek=
          latestWeek();

        selectedFilter=
          row.dataset.picker;

        openFullView();

      }

      row.addEventListener(
        "click",
        openPickerWeek
      );

      row.addEventListener(
        "keydown",
        event=>{

          if(
            event.key==="Enter"
            ||
            event.key===" "
          ){

            event.preventDefault();

            openPickerWeek();

          }

        }
      );

    }
  );

}


/* =========================================================
   RESULT ICON
========================================================= */

function resultIcon(
  pick
){

  if(
    pick.status!=="FINAL"
  ){
    return "⏳";
  }

  if(
    pick.result==="WIN"
  ){
    return "💰";
  }

  if(
    pick.result==="LOSS"
  ){
    return "❌";
  }

  if(
    pick.result==="PUSH"
  ){
    return "➖";
  }

  return "⏳";

}


/* =========================================================
   WEEK SELECTOR
========================================================= */

function renderWeeks(){

  const weeks=
    DATA.weeks?.length
    ?
    DATA.weeks
    :
    [1];


  if(
    !selectedWeek
  ){

    selectedWeek=
      +weeks.at(-1);

  }


  $("#weeks").innerHTML=
    weeks.map(
      week=>
        `
        <button
          class="weekbtn ${
            +week===+selectedWeek
            ?
            "active"
            :
            ""
          }"
          data-week="${week}">
          Week ${week}
        </button>
        `
    ).join(
      ""
    );


  document
    .querySelectorAll(
      ".weekbtn"
    )
    .forEach(
      button=>{

        button.addEventListener(
          "click",
          ()=>{

            selectedWeek=
              +button.dataset.week;

            renderWeeks();

            renderFull();

          }
        );

      }
    );

}


/* =========================================================
   FILTERS
========================================================= */

function renderFilters(){

  const filters=[
    "All",
    ...PICKERS,
    "Wins",
    "Losses",
    "Open"
  ];


  $("#filters").innerHTML=
    filters.map(
      filter=>
        `
        <button
          class="filterbtn ${
            selectedFilter===filter
            ?
            "active"
            :
            ""
          }"
          data-filter="${filter}">
          ${filter}
        </button>
        `
    ).join(
      ""
    );


  document
    .querySelectorAll(
      ".filterbtn"
    )
    .forEach(
      button=>{

        button.addEventListener(
          "click",
          ()=>{

            selectedFilter=
              button.dataset.filter;

            renderFilters();

            renderFull();

          }
        );

      }
    );

}


/* =========================================================
   PICK FILTER
========================================================= */

function pickPassesFilter(
  pick
){

  if(
    selectedFilter==="All"
  ){
    return true;
  }


  if(
    PICKERS.includes(
      selectedFilter
    )
  ){

    return (
      pick.picker===selectedFilter
    );

  }


  if(
    selectedFilter==="Wins"
  ){

    return (
      pick.result==="WIN"
      &&
      pick.status==="FINAL"
    );

  }


  if(
    selectedFilter==="Losses"
  ){

    return (
      pick.result==="LOSS"
      &&
      pick.status==="FINAL"
    );

  }


  if(
    selectedFilter==="Open"
  ){

    return (
      pick.status!=="FINAL"
    );

  }


  return true;

}


/* =========================================================
   FULL CARD VIEW
========================================================= */

function renderFull(){

  const filtered=
    DATA.picks.filter(
      pick=>
        +pick.week===+selectedWeek
        &&
        pickPassesFilter(
          pick
        )
    );


  const visiblePickers=
    PICKERS.filter(
      picker=>
        (
          selectedFilter==="All"
          ||
          selectedFilter==="Wins"
          ||
          selectedFilter==="Losses"
          ||
          selectedFilter==="Open"
          ||
          selectedFilter===picker
        )
    );


  $("#cardBody").innerHTML=
    visiblePickers.map(
      picker=>{

        const picks=
          filtered
          .filter(
            pick=>
              pick.picker===picker
          )
          .sort(
            (a,b)=>
              (
                a.posted_at
                ||
                ""
              )
              .localeCompare(
                b.posted_at
                ||
                ""
              )
          );


        if(
          !picks.length
          &&
          selectedFilter!=="All"
          &&
          PICKERS.includes(
            selectedFilter
          )
        ){

          return `
            <section class="pickerBlock">

              <div class="pickerTitle">

                <span>
                  ${picker.toUpperCase()}
                </span>

                <span>
                  0-0
                </span>

              </div>

              <div class="empty">
                No matching picks for this filter.
              </div>

            </section>
          `;

        }


        if(
          !picks.length
        ){
          return "";
        }


        const stats=
          statsForPicks(
            picks
          );


        const rows=
          picks.map(
            pick=>
              `
              <div class="pick">

                <div>

                  <div class="sel">

                    ${
                      pick.selection
                      ||
                      "Pick"
                    }

                  </div>

                  <div class="meta">

                    ${
                      pick.added_pick
                      ?
                      '<span class="badge">ADDED PICK</span>'
                      :
                      ""
                    }

                    ${
                      pick.final_score
                      ?
                      `${pick.final_score} · `
                      :
                      ""
                    }

                    ${
                      pick.source_url
                      ?
                      `
                        <a
                          class="source"
                          href="${pick.source_url}"
                          target="_blank"
                          rel="noopener">
                          Source ↗
                        </a>
                      `
                      :
                      ""
                    }

                  </div>

                </div>

                <div class="result">

                  ${
                    resultIcon(
                      pick
                    )
                  }

                </div>

              </div>
              `
          ).join(
            ""
          );


        return `
          <section class="pickerBlock">

            <div class="pickerTitle">

              <span>
                ${picker.toUpperCase()}
              </span>

              <span>

                ${
                  recordFromValues(
                    stats.wins,
                    stats.losses,
                    stats.pushes
                  )
                }

              </span>

            </div>

            ${rows}

          </section>
        `;

      }
    ).join(
      ""
    )
    ||
    `
      <div class="empty">
        No picks match this filter.
      </div>
    `;

}


/* =========================================================
   VIEW NAVIGATION
========================================================= */

function openFullView(){

  $("#overview")
    .classList
    .remove(
      "active"
    );

  $("#full")
    .classList
    .add(
      "active"
    );

  renderWeeks();

  renderFilters();

  renderFull();

  window.scrollTo(
    0,
    0
  );

}


$("#openCards").addEventListener(
  "click",
  ()=>{

    selectedWeek=
      latestWeek();

    selectedFilter=
      "All";

    openFullView();

  }
);


$("#back").addEventListener(
  "click",
  ()=>{

    $("#full")
      .classList
      .remove(
        "active"
      );

    $("#overview")
      .classList
      .add(
        "active"
      );

    window.scrollTo(
      0,
      0
    );

  }
);


/* =========================================================
   LOAD DATA
========================================================= */

fetch(
  "data/dashboard.json",
  {
    cache:"no-store"
  }
)

.then(
  response=>{

    if(
      !response.ok
    ){

      throw new Error(
        "Dashboard data unavailable"
      );

    }

    return response.json();

  }
)

.then(
  data=>{

    DATA=data;

    renderStatus();

    renderCards();

    renderChart();

    renderWeekBoard();


    if(
      data.updated_at
    ){

      $("#updated").textContent=
        `Updated ${
          new Date(
            data.updated_at
          )
          .toLocaleString()
        }`;

    }

  }
)

.catch(
  error=>{

    console.error(
      error
    );

    renderCards();

    renderChart();

    renderWeekBoard();

  }
);

</script>
